<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杂谈 · 笔记目录</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #2c2c2a;
    --muted: #5f5e5a;
    --border: #e2e1dc;
    --blue: #185fa5;
    --blue-bg: #e6f1fb;
    --teal: #0f6e56;
    --teal-bg: #e1f5ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.7;
    padding: 52px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 30px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: 2px; }
  header p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .meta { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .badge { background: var(--blue-bg); color: var(--blue); border-radius: 999px; padding: 3px 13px; font-size: 13px; }
  .badge.t { background: var(--teal-bg); color: var(--teal); }
  .hint { color: var(--muted); font-size: 13px; margin: 18px 0 12px; }
  ul.notes { list-style: none; display: grid; gap: 12px; }
  ul.notes li {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color .15s ease, transform .15s ease;
  }
  ul.notes li:hover { border-color: #85b7eb; transform: translateY(-1px); }
  ul.notes a { display: block; padding: 16px 22px; text-decoration: none; color: inherit; }
  ul.notes .title { font-size: 16px; font-weight: 500; word-break: break-all; }
  ul.notes .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  footer { margin-top: 42px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--blue); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  #retry { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>杂谈</h1>
    <p>学习笔记 · 技术随笔 · 杂项产出 —— 每一篇都是独立页面，点标题即看</p>
    <div class="meta">
      <span class="badge" id="count">共 0 篇笔记</span>
      <span class="badge t">GitHub Pages 托管</span>
    </div>
  </header>
  <p class="hint">目录实时同步自仓库；若接口暂时不可用，会自动显示下方内置的完整列表</p>
  <ul class="notes" id="list"></ul>
  <div class="empty" id="empty" style="display:none">仓库里还没有 HTML 笔记，推一篇就会自动出现在这里</div>
  <footer>
    <span>仓库：</span><a href="https://github.com/QiDiSong/zatan" target="_blank" rel="noopener">github.com/QiDiSong/zatan</a>
    <span id="status"></span>
  </footer>
</div>
<script>
const OWNER = "QiDiSong";
const REPO = "zatan";
const BRANCH = "main";

/* ------------------------------------------------------------------
   内置笔记列表（兜底用）
   推送新笔记后，把文件名补进这个数组，接口不可用时也能正常显示。
   顺序无所谓，渲染前会统一按名称排序。
   ------------------------------------------------------------------ */
const NOTES = [
  "程序员的自我修养-编译链接汇编-记忆笔记.html",
  "C++面试宝典-50道高频题与追问.html",
  "程序员的自我修养-编译链接装载-面试50问.html",
  "深度学习图编译器-面试50问.html",
  "深度学习图算子全解-面试问答与避坑.html",
  "AIPU构建工具_面试100问.html",
  "AIPU构建工具_MC阶段面试50问.html",
  "AIPU构建工具_MqBuilder流程面试50问.html"
];

const list = document.getElementById("list");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const status = document.getElementById("status");

function titleOf(name) {
  return name.replace(/\.html?$/i, "").replace(/_/g, " ");
}

function render(notes, withSize) {
  const sorted = notes.slice().sort(function (a, b) {
    return a.name.localeCompare(b.name, "zh");
  });
  if (!sorted.length) {
    list.innerHTML = "";
    empty.style.display = "block";
    count.textContent = "共 0 篇笔记";
    return;
  }
  empty.style.display = "none";
  list.innerHTML = sorted.map(function (f) {
    const sub = withSize && f.size
      ? "HTML 笔记 · " + (f.size / 1024).toFixed(1) + " KB"
      : "HTML 笔记";
    return '<li><a href="./' + encodeURIComponent(f.name) + '" target="_blank" rel="noopener">' +
      '<div class="title">' + titleOf(f.name) + '</div>' +
      '<div class="sub">' + sub + '</div>' +
      '</a></li>';
  }).join("");
  count.textContent = "共 " + sorted.length + " 篇笔记";
}

/* 数据源 1：GitHub 官方接口（最新，但未认证时有 60 次/小时的限流） */
async function fromGitHub() {
  const resp = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/");
  if (!resp.ok) throw new Error("GitHub API HTTP " + resp.status);
  const files = await resp.json();
  return files
    .filter(function (f) { return f.type === "file" && /\.html?$/i.test(f.name) && f.name.toLowerCase() !== "index.html"; })
    .map(function (f) { return { name: f.name, size: f.size }; });
}

/* 数据源 2：jsDelivr 目录接口（不限流，作为限流时的备用） */
async function fromJsDelivr() {
  const resp = await fetch("https://data.jsdelivr.com/v1/packages/gh/" + OWNER + "/" + REPO + "@" + BRANCH);
  if (!resp.ok) throw new Error("jsDelivr HTTP " + resp.status);
  const data = await resp.json();
  const out = [];
  (function walk(nodes) {
    (nodes || []).forEach(function (f) {
      if (f.type === "directory" || (f.files && f.files.length)) {
        walk(f.files);
      } else {
        out.push({ name: f.name, size: f.size || 0 });
      }
    });
  })(data.files);
  return out.filter(function (f) {
    return /\.html?$/i.test(f.name) && f.name.toLowerCase() !== "index.html";
  });
}

async function loadNotes() {
  status.textContent = " · 正在同步…";
  try {
    const notes = await fromGitHub();
    render(notes, true);
    status.textContent = " · 目录已实时同步";
    return;
  } catch (e1) {
    try {
      const notes = await fromJsDelivr();
      render(notes, true);
      status.textContent = " · 目录已同步（备用源）";
      return;
    } catch (e2) {
      /* 两个接口都不可用：保留内置列表 */
      status.innerHTML = ' · 接口暂不可用，正在显示内置列表（<a href="#" id="retry">重试</a>）';
      const btn = document.getElementById("retry");
      if (btn) btn.addEventListener("click", function (ev) { ev.preventDefault(); loadNotes(); });
    }
  }
}

/* 先用内置列表立即渲染，避免白屏；随后再尝试联网刷新 */
render(NOTES.map(function (n) { return { name: n }; }), false);
loadNotes();
</script>
</body>
</html>
